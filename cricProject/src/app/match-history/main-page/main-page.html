<!-- PAGE -->
<div class="w-full h-full min-h-screen bg-[#050816] px-4 sm:px-6 lg:px-10

py-8 ">

    <!-- TOP -->
    <div class="flex items-center
    justify-between

    mb-8">

        <!-- LEFT -->
        <div>

            <p class="uppercase
            tracking-[0.35em]
            text-[10px] sm:text-xs
            text-zinc-500
            font-black">
                Rooftop Cricket Archive
            </p>

            <h1 class="text-5xl sm:text-4xl
            font-black text-white
            mt-3">
                Match History
            </h1>
        </div>

        <!-- TOTAL -->
        <div class="hidden sm:flex
        flex-col items-end">

            <p class="text-zinc-500
            text-sm">
                Total Matches
            </p>

            <h1 class="text-4xl   font-black text-amber-400">
                {{matches.length}}
            </h1>

        </div>

    </div>

    <!-- MATCHES -->
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3

    gap-5">

        @for(match of matches; track match.id){

        <!-- CARD -->
        <button class="group relative overflow-hidden rounded-[2.5rem]  border border-white/10  bg-white/3  p-6
        text-left transition-all duration-300 hover:bg-white/5 hover:border-white/20 hover:scale-[1.02]">

            <!-- GLOW -->
            <div class="absolute inset-0   opacity-0   group-hover:opacity-10 transition-all duration-500   bg-linear-to-br
            from-amber-400/5 via-transparent to-blue-400/5"> </div>

            <!-- CONTENT -->
            <div class="relative z-10">

                <!-- TOP -->
                <div class="flex items-start
                justify-between">

                    <!-- DATE -->
                    <div>

                        <p class="text-zinc-500 text-xs  uppercase tracking-[0.25em] font-bold">
                            Match
                        </p>

                        <p class="text-zinc-400 text-sm  mt-2">
                            {{formatDate(match.createdAt)}}
                        </p>

                    </div>

                    <!-- RESULT -->
                    <div class="px-3 py-2   rounded-2xl bg-emerald-400/10    border border-emerald-400/20">
                        <p class="text-emerald-400 text-xs font-black">
                        {{getMatchTime(match.createdAt)}}
                        </p>
                    </div>

                </div>

                <!-- SCORES -->
                <div class="mt-8 space-y-5">

                    <!-- TEAM A -->
                    <div class="flex items-center
                    justify-between">

                        <div>

                            <p class="text-white text-xl font-black">
                                First Innings
                            </p>

                        </div>

                        <div class="text-right">

                            <h1 class="text-3xl font-black text-white">

                                {{match.innings[0].firstInningsTotalRuns}}/{{match.innings[0].firstInningsTotalWickets}}

                            </h1>

                            <p class="text-zinc-500  text-sm">

                                {{
                                Math.floor(
                                match.innings[0].firstInningsTotalBalls / 6
                                )
                                }}.
                                {{
                                match.innings[0].firstInningsTotalBalls % 6
                                }}
                                Overs

                            </p>

                        </div>

                    </div>

                    <!-- TEAM B -->
                    <div class="flex items-center
                    justify-between">

                        <div>

                            <p class="text-white

                            text-xl

                            font-black">

                               Second Innings

                            </p>

                        </div>

                        <div class="text-right">

                            <h1 class="text-3xl

                            font-black

                            text-white">

                                {{match.innings[1].secondInningsTotalRuns}}/{{match.innings[1].secondInningsTotalWickets}}

                            </h1>

                            <p class="text-zinc-500
                            text-sm">

                                {{
                                Math.floor(
                                match.innings[1].secondInningsTotalBalls / 6
                                )
                                }}.
                                {{
                                match.innings[1].secondInningsTotalBalls % 6
                                }}
                                Overs

                            </p>

                        </div>

                    </div>

                </div>

                <!-- DIVIDER -->
                <div class="h-px

                bg-white/5

                my-6">

                </div>

                <!-- BOTTOM -->
                <div class="flex items-end
                justify-between gap-4">

                    <!-- MOTM -->
                    <div>

                        <p class="text-zinc-500

                        text-xs

                        uppercase

                        tracking-[0.2em]

                        font-bold">

                            Player Of The Match

                        </p>

                        <div class="flex items-center gap-3

                        mt-3">

                            <!-- PHOTO -->
                            <img [src]="match.motm.playerPhoto" class="w-12 h-12

                            rounded-full

                            object-cover

                            border border-white/10">

                            <!-- INFO -->
                            <div>

                                <h1 class="text-white

                                font-black">

                                    {{match.motm.playerName}}

                                </h1>

                                <p class="text-zinc-400

                                text-sm">

                                @if(match.motm.runs > 0 && match.motm.wickets > 0){

                                    {{match.motm.runs}} Runs

                                    •

                                    {{match.motm.wickets}} Wickets
                                }
                                @else if(match.motm.runs > 0 && match.motm.wickets == 0){
                                    {{match.motm.runs}} Runs
                                }
                                @else if(match.motm.runs == 0 && match.motm.wickets > 0){
                                    {{match.motm.wickets}} Wickets
                                }

                                </p>

                            </div>

                        </div>

                    </div>

                    <!-- VIEW -->
                    <div [routerLink]="['/match-scorecard', match.id]" class="cursor-pointer text-right">

                        <p class="text-amber-400

                        text-sm

                        font-bold">

                            View

                        </p>

                        <p class="text-zinc-500

                        text-xs

                        mt-1">

                            Full Scorecard

                        </p>

                    </div>

                </div>

            </div>

        </button>

        }

    </div>

</div>
