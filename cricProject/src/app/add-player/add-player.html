<form
  #playerForm="ngForm"
  (ngSubmit)="addPlayer(playerForm)"
  class="w-full h-full bg-[#050B18] text-white relative flex items-center justify-center flex-col py-10 space-y-16 px-6"
>
  @if (isLoading) {
    <div
      class="w-full h-full flex items-center justify-center fixed top-0 left-0 bg-[#050B18] z-10"
    >
      <div class="relative w-12.5 aspect-square grid">
        <!-- OUTER -->
        <div
          class="absolute inset-0 bg-size-[300%_4px,4px_300%,300%_4px,4px_300%] bg-no-repeat animate-loader"
        ></div>

        <!-- INNER -->
        <div
          class="absolute inset-2.5 scale-x-[-1] bg-bg-size-[300%_4px,4px_300%,300%_4px,4px_300%] bg-no-repeat animate-loader-delayed"
        ></div>
      </div>
    </div>
  }

  <h1 class="font-bold text-xl">Add New Player</h1>

  <div class="flex flex-col items-center justify-center w-full lg:w-1/2 h-full space-y-10">
    <!-- PHOTO -->
    <div class="w-full flex flex-col items-center justify-center">
      <label
        for="playerPhoto"
        class="relative w-56 h-56 rounded-full border-2 bg-white/5 backdrop-blur-xl flex flex-col items-center justify-center cursor-pointer overflow-hidden hover:scale-105 hover:shadow-[0_0_40px_rgba(68,212,59,0.35)] transition-all duration-300"
        [ngClass]="{
          'border-dashed border-[#44d43b]': !previewImage,
          'border-solid border-white/10': previewImage,
        }"
      >
        <!-- PREVIEW -->
        @if (previewImage != null) {
          <img [src]="previewImage" class="absolute inset-0 w-full h-full object-cover" />

          <div class="absolute inset-0 bg-black/30"></div>
        }

        <!-- UPLOAD CONTENT -->
        @if (!previewImage) {
          <div class="relative z-10 flex flex-col items-center space-y-3">
            <!-- ICON -->
            <div
              class="w-16 h-16 rounded-full bg-[#44d43b]/15 flex items-center justify-center shadow-[0_0_25px_rgba(68,212,59,0.25)]"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-8 h-8 text-[#44d43b]"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M3 15a4 4 0 014-4h.26A8 8 0 1119 16h-1m-4-4v9m0 0l-3-3m3 3l3-3"
                />
              </svg>
            </div>

            <!-- TEXT -->
            <div class="text-center">
              <h2 class="text-white font-semibold text-lg">Upload Photo</h2>

              <p class="text-zinc-400 text-sm">JPG, PNG</p>
            </div>
          </div>
        }
      </label>

      <!-- HIDDEN INPUT -->
      <input
        type="file"
        id="playerPhoto"
         accept="image/jpeg,image/png,image/webp"
        class="hidden"
        (change)="onImageSelect($event)"
      />
    </div>

    <!-- Photo Crop Editor -->
    @if (showCropper) {
    <div class="fixed inset-0 z-100 flex items-center justify-center
               bg-black/80 p-4 backdrop-blur-md">
      <div class="max-h-[92vh] w-full max-w-xl overflow-y-auto
                 rounded-3xl border border-white/10 bg-[#0b1220]
                 p-5 text-white shadow-2xl sm:p-7">
        <!-- Header -->
        <div class="mb-5 flex items-start justify-between gap-4">
          <div>
            <p class="text-xs font-black uppercase tracking-[0.25em] text-[#94F505]">
              Photo Studio
            </p>
    
            <h2 class="mt-2 text-2xl font-black">
              Adjust Your Photo
            </h2>
    
            <p class="mt-2 text-sm text-zinc-400">
              Drag the image to position it and zoom until it looks right.
            </p>
          </div>
    
          <button type="button" (click)="cancelCrop()" class="flex h-10 w-10 shrink-0 items-center justify-center
                     rounded-full border border-white/10 bg-white/5
                     text-xl text-zinc-300 transition hover:bg-white/10" aria-label="Cancel photo editing">
            ×
          </button>
        </div>
    
        <!-- Cropper -->
        <div class="overflow-hidden rounded-2xl border border-white/10
                   bg-[#050B18] p-2">
          <div class="h-80 w-full">
            <image-cropper [imageFile]="cropperFile ?? undefined" [maintainAspectRatio]="true" [aspectRatio]="1" [roundCropper]="true"
              [allowMoveImage]="true" [(transform)]="transform" format="jpeg" output="blob" [resizeToWidth]="512"
              [imageQuality]="90" backgroundColor="#050B18" (imageCropped)="imageCropped($event)"
              (loadImageFailed)="loadImageFailed()" class="block h-full w-full" style="
                  --cropper-outline-color: rgba(148, 245, 5, 0.75);
                  --cropper-border: 2px solid #94F505;
                  --cropper-hover-border: 2px solid #94F505;
                  --cropper-focus-border: 2px solid #94F505;
                "></image-cropper>
          </div>
        </div>
    
        <!-- Zoom Controls -->
        <div class="mt-5 rounded-2xl border border-white/10 bg-white/3 p-4">
          <p class="mb-3 text-center text-xs font-bold uppercase
                      tracking-[0.2em] text-zinc-400">
            Adjust Zoom
          </p>
    
          <div class="flex items-center justify-center gap-3">
            <button type="button" (click)="zoomOut()" class="flex h-12 w-12 items-center justify-center rounded-xl
                       border border-white/10 bg-white/5 text-2xl
                       transition hover:bg-white/10" aria-label="Zoom out">
              −
            </button>
    
            <button type="button" (click)="resetCrop()" class="rounded-xl border border-white/10 bg-white/5
                       px-5 py-3 text-sm font-bold text-zinc-300
                       transition hover:bg-white/10">
              Reset
            </button>
    
            <button type="button" (click)="zoomIn()" class="flex h-12 w-12 items-center justify-center rounded-xl
                       border border-[#94F505]/30 bg-[#94F505]/10
                       text-2xl text-[#94F505] transition hover:bg-[#94F505]/20" aria-label="Zoom in">
              +
            </button>
          </div>
    
          <p class="mt-3 text-center text-xs text-zinc-500">
            The final photo will be saved in a square format.
          </p>
        </div>
    
        <!-- Actions -->
        <div class="mt-5 grid grid-cols-2 gap-3">
          <button type="button" (click)="cancelCrop()" class="rounded-xl border border-white/10 bg-white/5
                     px-4 py-3 font-bold text-zinc-300 transition
                     hover:bg-white/10">
            Cancel
          </button>
    
          <button type="button" (click)="useCroppedImage()" [disabled]="!croppedBlob" class="rounded-xl bg-[#94F505] px-4 py-3 font-black
                     text-black transition hover:bg-[#aaff20]
                     disabled:cursor-not-allowed disabled:opacity-40">
            Use This Photo
          </button>
        </div>
      </div>
    </div>
    }

    <!-- FORM FIELDS -->
    <div class="w-full flex flex-col space-y-10">
      <!-- FULL NAME -->
      <div class="space-y-4 w-full flex flex-col">
        <div class="space-x-2 flex items-center justify-start">
          <img src="icons/user.png" class="w-6" />

          <label class="text-white font-semibold tracking-wide"> Full Name </label>
        </div>

        <div
          class="w-full h-16 rounded-2xl bg-white/5 border border-white/10 backdrop-blur-xl flex items-center px-5 transition-all duration-300 focus-within:border-[#44d43b] focus-within:shadow-[0_0_30px_rgba(68,212,59,0.18)]"
        >
          <input
            type="text"
            name="fullName"
            [(ngModel)]="player.fullName"
            placeholder="Enter player name"
            class="w-full bg-transparent outline-none text-white placeholder:text-zinc-500 font-medium"
            required
          />
        </div>
      </div>

      <!-- DISPLAY NAME -->
      <div class="space-y-4 w-full flex flex-col">
        <div class="space-x-2 flex items-center justify-start">
          <img src="icons/user.png" class="w-6" />

          <label class="text-white font-semibold tracking-wide"> Display Name </label>
        </div>

        <div
          class="w-full h-16 rounded-2xl bg-white/5 border border-white/10 backdrop-blur-xl flex items-center px-5 transition-all duration-300 focus-within:border-[#44d43b] focus-within:shadow-[0_0_30px_rgba(68,212,59,0.18)]"
        >
          <input
            type="text"
            name="displayName"
            [(ngModel)]="player.displayName"
            placeholder="Name shown on scorecard"
            class="w-full bg-transparent outline-none text-white placeholder:text-zinc-500 font-medium"
            required
          />
        </div>
      </div>

      <!-- STYLE -->
      <div class="space-y-4 w-full flex flex-col">
        <div class="space-x-2 flex items-center justify-start">
          <img src="icons/hand.png" class="w-6" />

          <label class="text-white font-semibold tracking-wide"> Style </label>
        </div>

        <div class="w-full min-h-32 flex items-center justify-between">
          <!-- LEFT -->
          <label
            class="w-[49%] h-32 rounded-xl border cursor-pointer flex flex-col items-start justify-center px-5 transition-all duration-300 bg-white/5 backdrop-blur-xl"
            [class.border-[#44d43b]]="player.style === 'left'"
            [class.shadow-[0_0_30px_rgba(68,212,59,0.18)]]="player.style === 'left'"
            [class.border-white/10]="player.style !== 'left'"
          >
            <input
              type="radio"
              name="style"
              value="left"
              class="hidden"
              [(ngModel)]="player.style"
              required
            />

            <h1 class="font-semibold text-white text-lg">Left Handed</h1>

            <h2 class="text-[#44d43b] font-semibold">LH</h2>
          </label>

          <!-- RIGHT -->
          <label
            class="w-[49%] h-32 rounded-xl border cursor-pointer flex flex-col items-start justify-center px-5 transition-all duration-300 bg-white/5 backdrop-blur-xl"
            [class.border-[#44d43b]]="player.style === 'right'"
            [class.shadow-[0_0_30px_rgba(68,212,59,0.18)]]="player.style === 'right'"
            [class.border-white/10]="player.style !== 'right'"
          >
            <input
              type="radio"
              name="style"
              value="right"
              class="hidden"
              [(ngModel)]="player.style"
              required
            />

            <h1 class="font-semibold text-white text-lg">Right Handed</h1>

            <h2 class="text-[#44d43b] font-semibold">RH</h2>
          </label>
        </div>
      </div>
    </div>

    <!-- BUTTON -->
    <button
      type="submit"
      [disabled]="playerForm.invalid"
      class="font-bold bg-[#94F505] text-black w-full py-3 rounded disabled:opacity-50 disabled:cursor-not-allowed"
    >
      + Save Player
    </button>
  </div>
</form>
