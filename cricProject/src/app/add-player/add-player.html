<div
    class="w-full h-full bg-[#050B18] text-white relative flex items-center justify-center flex-col py-10 space-y-16 px-6">

    <h1 class="font-bold text-xl ">Add New Player</h1>

    <div class="flex flex-col items-center justify-center w-full  lg:w-1/2 h-full space-y-10">
        <div class="w-full flex flex-col items-center justify-center">

            <label for="playerPhoto" class="relative w-56 h-56 rounded-full border-2 border-dashed border-[#44d43b]
            bg-white/5 backdrop-blur-xl
            flex flex-col items-center justify-center
            cursor-pointer overflow-hidden
            hover:scale-105 hover:shadow-[0_0_40px_rgba(68,212,59,0.35)]
            transition-all duration-300">

                <!-- Preview Image -->
                <img *ngIf="previewImage" [src]="previewImage" class="absolute inset-0 w-full h-full object-cover" />

                <!-- Overlay -->
                <div class="absolute inset-0 bg-black/40" *ngIf="previewImage">
                </div>

                <!-- Upload Content -->
                <div class="relative z-10 flex flex-col items-center space-y-3">

                    <!-- Icon -->
                    <div class="w-16 h-16 rounded-full bg-[#44d43b]/15
                flex items-center justify-center
                shadow-[0_0_25px_rgba(68,212,59,0.25)]">

                        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-[#44d43b]" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor">

                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 15a4 4 0 014-4h.26A8 8 0 1119 16h-1m-4-4v9m0 0l-3-3m3 3l3-3" />

                        </svg>

                    </div>

                    <!-- Text -->
                    <div class="text-center">

                        <h2 class="text-white font-semibold text-lg">
                            Upload Photo
                        </h2>

                        <p class="text-zinc-400 text-sm">
                            JPG, PNG
                        </p>

                    </div>

                </div>

            </label>

            <!-- Hidden Input -->
            <input type="file" id="playerPhoto" accept="image/*" class="hidden" (change)="onImageSelect($event)" />

        </div>


        <div class="w-full flex flex-col space-y-10">

            <div class="space-y-4 w-full flex flex-col ">

                <!-- Label -->
                <div class="space-x-2 flex items-center justify-start">
                    <!-- Icon -->
                    <img src="icons/user.png" alt="" class="w-6">
                    <label class="text-white font-semibold tracking-wide"> Full Name </label>
                </div>

                <!-- Input Wrapper -->
                <div class="w-full h-16 space-x-4 rounded-2xl bg-white/5 border border-white/10 backdrop-blur-xl flex items-center px-5 transition-all duration-300 focus-within:border-[#44d43b]
            focus-within:shadow-[0_0_30px_rgba(68,212,59,0.18)]">

                    <!-- Input -->
                    <input type="text" placeholder="Enter player name" class="w-full bg-transparent outline-none
                text-white placeholder:text-zinc-500
                font-medium" />

                </div>
            </div>

            <div class="space-y-4 w-full flex flex-col ">

                <!-- Label -->
                <div class="space-x-2 flex items-center justify-start">
                    <!-- Icon -->
                    <img src="icons/user.png" alt="" class="w-6">
                    <label class="text-white font-semibold tracking-wide"> Display Name </label>
                </div>

                <!-- Input Wrapper -->
                <div class="w-full h-16  rounded-2xl bg-white/5 border border-white/10 backdrop-blur-xl flex items-center px-5 transition-all duration-300 focus-within:border-[#44d43b]
            focus-within:shadow-[0_0_30px_rgba(68,212,59,0.18)]">



                    <!-- Input -->
                    <input type="text" placeholder="Name that will be shown on the scorecard" class="w-full bg-transparent outline-none
              text-white placeholder:text-zinc-500
               font-medium" />

                </div>
            </div>

            <div class="space-y-4 w-full flex flex-col">

                <!-- Label -->
                <div class="space-x-2 flex items-center justify-start">
                    <!-- Icon -->
                    <img src="icons/hand.png" alt="" class="w-6">
                    <label class="text-white font-semibold tracking-wide"> Style </label>
                </div>

                <div class="w-full min-h-32 flex items-center justify-between">

                    <!-- LEFT -->
                    <label class="w-[49%] h-32 rounded-xl border cursor-pointer
      flex flex-col items-start justify-center px-5
      transition-all duration-300
      bg-white/5 backdrop-blur-xl" [class.border-[#44d43b]]="handedness === 'left'"
                        [class.shadow-[0_0_30px_rgba(68,212,59,0.18)]]="handedness === 'left'"
                        [class.border-white/10]="handedness !== 'left'">

                        <input type="radio" name="handedness" value="left" class="hidden" [(ngModel)]="handedness" />

                        <h1 class="font-semibold text-white text-lg">
                            Left Handed
                        </h1>

                        <h2 class="text-[#44d43b] font-semibold">
                            LH
                        </h2>

                    </label>

                    <!-- RIGHT -->
                    <label class="w-[49%] h-32 rounded-xl border cursor-pointer
      flex flex-col items-start justify-center px-5
      transition-all duration-300
      bg-white/5 backdrop-blur-xl" [class.border-[#44d43b]]="handedness === 'right'"
                        [class.shadow-[0_0_30px_rgba(68,212,59,0.18)]]="handedness === 'right'"
                        [class.border-white/10]="handedness !== 'right'">

                        <input type="radio" name="handedness" value="right" class="hidden" [(ngModel)]="handedness" />

                        <h1 class="font-semibold text-white text-lg">
                            Right Handed
                        </h1>

                        <h2 class="text-[#44d43b] font-semibold">
                            RH
                        </h2>

                    </label>

                </div>

            </div>

        </div>

        <button type="submit" class="font-bold bg-[#94F505] text-black w-full py-3 rounded"> + Save Player</button>
    </div>


</div>
