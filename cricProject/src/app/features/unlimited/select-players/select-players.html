<div class="w-full h-full bg-[#050B18] text-white relative">


    <!-- TOP BAR -->
    <div class="w-full sticky top-0 z-20
    bg-[#050B18]/80 backdrop-blur-2xl
    border-b border-white/5">

        <div class="px-5 py-5 flex items-center justify-between">

            <!-- LEFT -->
            <div class="flex flex-col">

                <!-- ACTIVE TEAM -->
                <div class="flex items-center gap-3">

                    <!-- PULSE -->
                    <div class="w-3 h-3 rounded-full animate-pulse" [ngClass]="{
    
                'bg-[#94F505] shadow-[0_0_20px_rgba(148,245,5,0.8)]':
                  currentTurn === 'A',
    
                'bg-purple-400 shadow-[0_0_20px_rgba(192,132,252,0.8)]':
                  currentTurn === 'B' }">

                    </div>

                    <!-- TITLE -->
                    <h1 class="text-2xl font-black tracking-tight" [ngClass]="{
    
                'text-[#94F505]':
                  currentTurn === 'A',
    
                'text-purple-400':
                  currentTurn === 'B'
    
              }">

                        Team {{ currentTurn }} Selecting

                    </h1>

                </div>

                <!-- SUBTEXT -->
                <p class="text-zinc-500 text-sm mt-2">

                    Pick your next player carefully.

                </p>



            </div>

            <!-- TURN COUNT -->
            <div class="px-4 py-2 rounded-2xl
          bg-white/5 border border-white/10">

                <h2 class="text-sm text-zinc-400 font-semibold">

                    {{ selectedPlayers.length }}
                    Picked

                </h2>

            </div>

        </div>

        <div class="flex items-center justify-center md:justify-end md:px-4 w-full ">
            @if(selectedPlayers.length > 3){

        <button (click)="goToTossPage()" class="group w-11/12 md:w-1/2 lg:w-[28%] h-15 px-6 rounded-[1.7rem] bg-[#38BDF8]/10 border border-[#38BDF8]/20
        backdrop-blur-2xl flex items-center justify-center gap-4 shadow-[0_0_40px_rgba(56,189,248,0.12)] hover:bg-[#38BDF8]/15  hover:scale-[1.02]
        active:scale-[0.97] transition-all duration-300">
        
            <!-- ICON -->
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-[#7DD3FC] transition-all duration-300
            group-hover:rotate-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.868v4.264a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
        
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M21 12c0 4.97-4.03 9-9 9s-9-4.03-9-9 4.03-9 9-9 9 4.03 9 9z" />
        
            </svg>
        
            <!-- TEXT -->
            <h1 class="text-white text-lg font-black tracking-wide cursor-pointer">
                Go to Match Toss
            </h1>
        
        </button>


            }

        </div>


        <div
            class="w-full h-full grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 py-10 px-6 row-auto">


            @for (player of players; track $index) {

            <!-- CARD -->
            <div (click)="selectPlayer(player)" class="relative rounded-3xl overflow-hidden
        aspect-3/4
        cursor-pointer
        group
        hover:scale-[1.03]
        active:scale-[0.98]
        transition-all duration-300
        shadow-[0_0_40px_rgba(0,0,0,0.4)]" [ngClass]="{

        'border-[#94F505] bg-[#94F505]/10 border-4':
            teamA.includes(player),

        'border-purple-400 bg-purple-400/10 border-4':
            teamB.includes(player),

        'opacity-40':
            selectedPlayers.includes(player.id!)

        }">

                <!-- IMAGE -->
                <img [src]="player.photoURL || 'https://images.pexels.com/photos/220453/pexels-photo-220453.jpeg'"
                    class="absolute inset-0
    w-full h-full object-cover object-center">

                <!-- DARK OVERLAY -->
                <div class="absolute inset-0
  bg-linear-to-t
  from-black/90
  via-black/20
  to-transparent">

                </div>

                <!-- GLOW -->
                <div class="absolute inset-0
  opacity-0 group-hover:opacity-100
  transition-all duration-300
  bg-[#94F505]/10">

                </div>

                <!-- NAME -->
                <div class="absolute bottom-0 left-0
  w-full p-4">

                    <h1 class="text-white font-black
    text-lg tracking-tight truncate">

                        {{ player.displayName }}

                    </h1>

                </div>

            </div>

            }
        </div>
    </div>
