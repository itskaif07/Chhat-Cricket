<div class="w-full min-h-screen bg-[#050B18] text-white overflow-hidden relative flex items-center justify-center px-6">

    <!-- BACKGROUND GLOW -->
    <div class="absolute -top-30 left-1/2 -translate-x-1/2
    w-125 h-125
    bg-linear-to-b
    from-[#38BDF8]
    to-[#0EA5E9]
    blur-[140px] rounded-full opacity-20
    pointer-events-none">

    </div>

    <!-- CONTENT -->
    <div class="relative z-10 w-full max-w-xl
    flex flex-col items-center text-center">

        <!-- MODE BADGE -->
        <div class="px-4 py-2 rounded-full
        bg-[#38BDF8]/10 border border-[#38BDF8]/20
        backdrop-blur-xl">

            <h2 class="text-xs tracking-[0.3em]
            text-[#38BDF8] font-bold">

                UNLIMITED OVERS

            </h2>

        </div>

        <!-- TITLE -->
        <h1 class="text-white text-5xl md:text-6xl font-black
        leading-none mt-10">

            ROOFTOP
            <br>
            BATTLE

        </h1>

        <!-- SUBTEXT -->
        <p class="text-zinc-400
        mt-6 leading-relaxed max-w-sm">

            Build your teams and start an endless rooftop cricket match.

        </p>

        <!-- ACTION -->
        <button [routerLink]="['/unlimited/select-players']" class="w-full mt-12 h-16 rounded-3xl cursor-pointer
        bg-linear-to-b
        from-[#38BDF8]
        to-[#0EA5E9]
        border border-[#38BDF8]/30
        text-black text-lg font-black
        shadow-[0_0_40px_rgba(56,189,248,0.2)]
        active:scale-[0.98]
        transition-all duration-300">

            SELECT PLAYERS

        </button>

    </div>

</div>
