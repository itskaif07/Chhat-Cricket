<div class="w-full h-full bg-[#050B18] overflow-hidden relative">

    <!-- BACKGROUND GLOW -->
    <div class="absolute -top-30 left-1/2 -translate-x-1/2
    w-125 h-125
    bg-[#38BDF8]/10 blur-[140px] rounded-full">

    </div>

    <!-- CONTENT -->
    <div class="relative z-10 w-full min-h-screen
    flex flex-col justify-between
    px-6 py-10 space-y-6">

        <!-- TOP -->
        <div class="flex flex-col items-center mt-6">

            <!-- MODE BADGE -->
            <div class="px-4 py-2 rounded-full
            bg-[#38BDF8]/10 border border-[#38BDF8]/20
            backdrop-blur-xl">

                <h2 class="text-xs tracking-[0.3em]
                text-[#38BDF8] font-bold">

                    UNLIMITED OVERS

                </h2>

            </div>

            <!-- TITLE -->
            <h1 class="text-white text-5xl font-black
            text-center leading-none mt-8">

                ROOFTOP
                <br>
                BATTLE

            </h1>

            <!-- SUBTEXT -->
            <p class="text-zinc-400 text-center
            mt-5 leading-relaxed max-w-sm">

                No over limits.
                No pressure.
                Just pure rooftop cricket chaos.

            </p>

        </div>

        <!-- CENTER -->
        <div class="flex flex-col items-center">

            <!-- COIN AREA -->
            <div (click)="tossCoin()" class="relative">

                <!-- GLOW -->
                <div class="absolute inset-0
                bg-[#38BDF8]/20 blur-3xl rounded-full">

                </div>

                <!-- COIN -->
                <button class="relative w-44 h-44 rounded-full
                bg-linear-to-b from-[#38BDF8] to-[#0EA5E9]
                border border-[#38BDF8]/30
                shadow-[0_0_40px_rgba(56,189,248,0.2)]
                flex items-center justify-center
                active:scale-95
                transition-all duration-300">

                    <!-- INNER -->
                    <div class="w-32 h-32 rounded-full
                    bg-black/10 border border-black/10
                    flex items-center justify-center">

                        <h1 class="text-black text-6xl font-black" [class.tossing]="isTossing">

                            {{ tossResult || '₹' }}

                        </h1>

                    </div>

                </button>

            </div>

            <!-- TEXT -->
            <h1 class="text-white text-2xl font-black mt-10">

                Toss For First Pick

            </h1>

            <p class="text-zinc-500 text-center
            mt-3 max-w-xs leading-relaxed">

                Winning team selects
                the first player.

            </p>

        </div>

        <!-- BOTTOM -->
        <div class="w-full flex flex-col gap-4">

            @if(tossResult === ''){
            <!-- SECONDARY -->
            <button [routerLink]="['/unlimited/select-players']" class="w-full h-16 rounded-3xl
            bg-white/5 border border-white/10
            backdrop-blur-xl
            text-white text-lg font-semibold
            active:scale-[0.98]
            transition-all duration-300">

                SKIP TOSS

            </button>
            }
            @else {

            <button [routerLink]="['/unlimited/select-players']" class="w-full h-16 rounded-3xl
                         bg-linear-to-b from-[#b8ff4f] to-[#94F505]
                border border-[#d9ff9b]/30
                        backdrop-blur-xl
                        text-black text-lg font-semibold
                        active:scale-[0.98]
                        transition-all duration-300">

                Continue

            </button>

            }

        </div>

    </div>

</div>
