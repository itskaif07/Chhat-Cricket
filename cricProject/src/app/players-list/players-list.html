<div class="w-full min-h-screen bg-[#050B18] text-white px-5 py-8 flex flex-col">
  <!-- HEADER -->
  <div class="w-full flex items-center justify-between mb-8">
    <div>
      <h1 class="text-3xl font-black tracking-tight">Players</h1>

      <p class="text-zinc-400 mt-1">{{ players.length }} Registered Players</p>
    </div>

    <!-- ADD PLAYER -->
    <div
      routerLink="/add-player"
      class="w-14 h-14 rounded-2xl bg-[#94F505] text-black flex items-center justify-center text-3xl font-bold shadow-[0_0_30px_rgba(148,245,5,0.35)] active:scale-95 transition-all"
    >
      +
    </div>
  </div>

  <!-- SEARCH -->
  <div
    class="w-full h-14 rounded-2xl bg-white/5 border border-white/10 backdrop-blur-xl px-5 flex items-center mb-8"
  >
    <input
      [(ngModel)]="searchText"
      (input)="searchPlayers()"
      type="text"
      placeholder="Search Players..."
      class="w-full bg-transparent outline-none text-white placeholder:text-zinc-500"
    />
  </div>

  <!-- PLAYERS GRID -->
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-5 pb-10">
    @for (player of filteredPlayers; track player.id) {
      <!-- CARD -->
      <div
        [routerLink]="['/player-info', player.id]"
        class="rounded-3xl overflow-hidden bg-white/5 border border-white/10 backdrop-blur-xl hover:scale-[1.02] active:scale-[0.98] transition-all duration-300 shadow-[0_0_30px_rgba(255,255,255,0.03)] cursor-pointer"
      >
        <!-- IMAGE -->
        <div class="aspect-square overflow-hidden relative">
          <img
            [src]="
              player.photoURL || 'https://images.pexels.com/photos/220453/pexels-photo-220453.jpeg'
            "
            class="w-full h-full object-cover object-center"
          />
        </div>

        <!-- DETAILS -->
        <div class="p-4 flex flex-col">
          <!-- DISPLAY NAME -->
          <h1 class="font-bold text-lg text-white truncate tracking-tight">
            {{ player.displayName }}
          </h1>

          <!-- FULL NAME -->
          <p class="text-zinc-400 text-sm truncate mt-1">
            {{ player.fullName }}
          </p>

          <!-- STYLE -->
          <div class="mt-4 flex items-center justify-between">
            <div class="px-3 py-1 rounded-full bg-[#94F505]/10 border border-[#94F505]/20">
              <!-- BIG SCREEN -->
              <h2 class="text-xs font-semibold text-[#94F505]">
                {{ player.style === 'right' ? 'Right Handed' : 'Left Handed' }}
              </h2>
            </div>

            <!-- ARROW -->
            <div
              class="w-9 h-9 rounded-xl bg-white/5 border border-white/10 min-[450px]:flex items-center justify-center hidden"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-4 h-4 text-white"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M9 5l7 7-7 7"
                />
              </svg>
            </div>
          </div>
        </div>
      </div>
    }

    @if (filteredPlayers.length === 0) {
      <div
        class="text-zinc-500 text-center bg-[#050B18] w-full h-full flex items-center justify-center"
      >
        <h1>No players found</h1>
      </div>
    }
  </div>
</div>
